convolution:
  sensor_h:     34
  sensor_w:     34
  in_channels:  2
  conv1_out:    12
  conv1_kernel: 5
  conv2_out:    32
  conv2_kernel: 5
  pool_kernel:  2

neuron_types:
  snntorch:
    lif1:    alpha        # alpha | leaky
    lif2:    alpha        # alpha | leaky
    lif_out: alpha        # alpha | leaky
  norse:
    lif1:    lif_cell     # lif_cell | lif_rec_cell
    lif2:    lif_cell     # lif_cell | lif_rec_cell
    lif_out: lif_cell     # lif_cell | lif_rec_cell
  spikingjelly:
    lif1:    izhikevich   # izhikevich | lif
    lif2:    izhikevich   # izhikevich | lif
    lif_out: izhikevich   # izhikevich | lif
  sinabs:
    lif1:    lif          # lif | iaf
    lif2:    lif          # lif | iaf
    lif_out: lif          # lif | iaf
  spyx:
    lif1:    lif          # lif | alif
    lif2:    lif          # lif | alif
    lif_out: lif          # lif | alif

