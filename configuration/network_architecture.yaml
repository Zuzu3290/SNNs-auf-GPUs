convolution:
  blocks:
    - out:    12
      kernel: 5
    - out:    32
      kernel: 5
  pool_kernel:  2
  padding:      0
  fc_hidden:    null
  batch_norm:   false

neuron:
  snntorch:
    beta: 0.9
    threshold: 1.0
    reset_mechanism: zero
    reset_delay: false
    surrogate:
      type: atan
      alpha: 2.0

  spikingjelly:
    tau: 10.0
    decay_input: false
    v_threshold: 1.0
    v_reset: 0.0
    detach_reset: false
    step_mode: s
    backend: torch
    surrogate:
      type: atan
      alpha: 2.0

  norse:
    dt: 0.001
    tau_mem_inv: 100.0
    v_th: 1.0
    v_reset: 0.0
    v_leak: 0.0
    reset_method: value
    input_scale: 10.0
    surrogate:
      type: circ
      alpha: 0.5

  sinabs:
    tau_mem: 9.491221581029905
    tau_syn: null
    norm_input: false
    spike_threshold: 1.0
    spike_fn: single
    reset_mechanism: zero
    v_reset: 0.0
    min_v_mem: null
    train_alphas: false
    surrogate:
      type: single_exponential
      grad_width: 0.5
      grad_scale: 1.0
