# How the network is TRAINED.
#
# What the network IS (layer dimensions, neuron) lives in network_architecture.yaml.
# How the DATA arrives (framing, slicing, cache) lives in data_workflow.yaml.

# ---------------------------------------------------------------------------
# dataset: which dataset this run uses.
#
# null (the default) means ASK -- the interactive menu, exactly as this pipeline has
# always worked. Leave it null for a hands-on run.
#
# Set it to skip the prompt, which anything non-interactive REQUIRES: a Colab cell, a
# scripted multi-seed sweep, or several runs launched at once cannot answer a prompt,
# and a run that needed one is not reproducible from its config alone.
#
# Accepts either the dataset name or its number in the menu. Case, spaces, hyphens and
# underscores are all ignored, so "DVS128 Gesture", "dvs128-gesture" and
# "dvs128_gesture" are the same. An unrecognised name RAISES at startup, naming the
# closest matches -- it never falls back to a default.
#
#   N-MNIST (1) | N-Caltech101 (2) | DAVIS Camera Pose (3) | DVS128 Gesture (4)
#   DSEC (5)    | Eye Tracking (6)
#
# See event_data_workflow/dataset_registry.py for the full registry.
# ---------------------------------------------------------------------------
dataset:
  name: null

# No `architecture:` block: the conv-SNN internals (filter counts, kernel sizes, pool
# size) live in network_architecture.yaml, the input sensor shape and output class count
# come from the dataset registry, and the slice duration moved to data_workflow.yaml with
# the rest of the slicing settings.

training:
  framework: sj                 # norse | torch | sj | sinabs
  device: cuda                  # cuda | cpu

  # Fixes weight init AND batch order, so a rerun reproduces and all four frameworks
  # start from identical conv/linear weights.
  seed: 0

  epochs: 2                     # full passes over the training set
  batch_size: 128               # used as-is when calibrate_batch_size is false

  # null = auto: one epoch is a full pass, derived from dataset size / batch size.
  # A number caps the epoch at that many batches (never more than a full pass).
  iterations_per_epoch: null

  # true  = live GPU probe picks batch_size, overriding the value above
  # false = batch_size above is used exactly as written, no probe
  # Either way iterations_per_epoch is resolved against the real loader.
  calibrate_batch_size: true

  # Untimed forward+backward passes before timing starts, so CUDA kernel compilation and
  # allocator warm-up are not charged to whichever framework runs first (measured: 174 ms
  # vs 41-80 ms). No optimizer step is taken. 0 disables.
  warmup_iterations: 5

  # Samples used for the batch-size-1 latency measurement (MLPerf Single-Stream).
  # 100 is enough for a stable median and p90. This is a SEPARATE, small pass run
  # outside any timed region -- it does not disturb the batched test numbers, and it
  # answers a different question: "one event arrives, how long until the answer is
  # ready" rather than "how much wall-clock does each sample cost at this batch size".
  # 0 skips it, and the three inference_latency_bs1_* columns are then left empty.
  latency_samples: 100

  # ONE optimizer and ONE loss for every framework -- these are plain torch, so giving a
  # framework its own would compare training recipes instead of frameworks.
  optimizer:
    type: nadam                 # nadam | adam | adamw | sgd  (unknown name raises)
    lr: 0.002
    weight_decay: 0.0
    momentum: 0.0               # sgd only, ignored by the others

  # cross_entropy = torch's own, neutral across frameworks
  # mse_count     = snnTorch's; belongs to ONE framework, so not neutral for comparison
  loss: cross_entropy

  # none   = learning rate stays constant
  # cosine = annealed toward ~0 by the last epoch (T_max = epochs, so short runs end near 0)
  lr_scheduler: cosine

  use_amp: false                # true | false. Changes speed AND numerics; state it explicitly.
  compute_capacity_metrics: false  # scalability-study-only diagnostics: Participation Ratio,
                                    # mutual information, spike entropy, gradient norms. Off by
                                    # default -- costs extra CPU-side computation once per run.
                                    # See docs/superpowers/specs/2026-09-04-capacity-metrics-design.md
  grad_accum_steps: 1           # batches accumulated before an optimizer step


  # TRADES robustness training: loss = CE(clean) + lambda * KL(clean || adversarial).
  trades_enabled: false         # adds ~(trades_steps * 2) forward passes per batch
  trades_epsilon: 0.05          # perturbation budget per element. 0.001 (subtle) .. 0.3 (heavy)
  trades_lambda: 4.0            # clean accuracy vs robustness. 1.0 (clean) .. 10.0 (robust)
  trades_steps: 3               # PGD iterations per batch. 1 (fast) .. 40 (strongest)

  # Two-sided per-neuron activity regularization on hidden LIF layers. Adds a loss term,
  # so it must be identical across frameworks -- keep off for comparison runs.
  activity_reg_enabled: false   # true | false
  activity_reg_min_rate: 0.01   # penalise neurons firing below this fraction of timesteps
  activity_reg_max_rate: 0.50   # penalise neurons firing above it
  activity_reg_lambda_low: 0.1  # penalty weight, dead neurons
  activity_reg_lambda_high: 0.1 # penalty weight, saturated neurons

output:
  output_dir: ./outputs
  plot_dir: ./outputs/plots
  data_dir: ./outputs/data
