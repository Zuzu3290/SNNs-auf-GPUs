architecture:
  input_size: 50
  hidden_size: 50
  hidden_layers: 5
  output_size: 10
  leak: 1.0
  override: false
  network_struct: S
  device: cuda
  simulator: ON

training:
  kernel: ON                   # ON → use the compiled CRSC CUDA kernel for LIF forward pass.
                                # Requires: python src/learning/setup.py build_ext --inplace
  kernel_mode: warp_oriented    # Which kernel path to use when kernel: ON.
                                # basic         — fixed 256-thread LIF, benchmark reference.
                                # temporal      — T-in-register, correct sequential LIF.
                                # warp_oriented — SM-saturating grid-stride, adaptive energy feedback (recommended).
  kernel_profile_energy: false  # Wrap timed calls with CUDA event energy estimation.
                                # Requires NVML on the GPU tier (not available on free Colab T4).
  framework: norse           # YAML selector: norse | torch | sj
  epochs: 5
  iterations_per_epoch: 200
  timesteps: 25
  batch_size: 128
  nap_times: 1
  learning_rate: 0.001
  weight_decay: 0.0001
  num_classes: 10
  # TRADES robustness training — penalises the network for changing its prediction under input corruption.
  # Loss = CrossEntropy(clean) + lambda * KL(clean || adversarial).
  trades_enabled: true          # Enable TRADES during training. Adds ~(trades_steps * 2) forward passes per batch.

  trades_epsilon: 0.05          # Perturbation budget: max allowed input corruption per element.
                                # Range: 0.001 (near-imperceptible) → 0.3 (heavy corruption).

  trades_lambda: 4.0            # Balances clean accuracy vs robustness. Higher = more robust, lower clean accuracy.
                                # Range: 1.0 (favour clean accuracy) → 10.0 (favour robustness).

  trades_steps: 3              # PGD iterations used to find worst-case input per batch. Recommended: 10 for training.
                                # Range: 1 (fast, weaker adversarial) → 40 (slow, strongest adversarial).

  activity_reg_enabled: true   # Two-sided per-neuron activity regularization on hidden LIF layers.
  activity_reg_min_rate: 0.01   # Penalize neurons firing less than 1% of timesteps  (dead neuron prevention).
  activity_reg_max_rate: 0.50   # Penalize neurons firing more than 50% of timesteps (saturation prevention).
  activity_reg_lambda_low: 0.1  # Penalty weight for dead neurons.
  activity_reg_lambda_high: 0.1 # Penalty weight for saturated neurons.

  num_workers: 6                # CPU DataLoader workers that prefetch batches while the GPU trains.
                                # More workers reduce GPU starvation between batches (better utilisation).
                                # Recommended: 4–8 on a workstation. Capped by CPU count automatically.
                                # Set to 0 to disable multiprocessing (needed for non-picklable transforms).

  stdp_enabled: true           # STDP causal correlation loss alongside BPTT.
  stdp_tau: 20.0                # Trace decay time constant in timesteps. Higher = longer memory of past spikes.
  stdp_a_plus: 0.01             # LTP strength — how strongly to reinforce causal (pre→post) spike order.
  stdp_a_minus: 0.01            # LTD strength — how strongly to penalise anticausal (post→pre) spike order.
  
acceleration:
  target_blocks_per_sm: 8      # Initial SM fill target. Adaptive feedback adjusts this at runtime.
  bps_min: 2                   # Minimum blocks per SM the feedback loop will reduce to.
  bps_max: 16                  # Maximum blocks per SM the feedback loop will increase to.
  energy_sample_every: 50      # Sample kernel elapsed time every N forward calls for feedback.
  energy_fast_threshold_ms: 0.5  # Below this → kernel finishing fast → increase blocks.
  energy_slow_threshold_ms: 2.0  # Above this → kernel too slow → decrease blocks.
  block_size: 256              # CUDA threads per block. Power of 2. Rarely needs changing.

runtime:
  spike_rate_ewma_alpha: 0.1         # EWMA smoothing factor for SpikeRateBus (0–1, lower = smoother).
  memory_allocator_overhead_mb: 512  # VRAM reserved for PyTorch caching allocator before zone split.
  vram_dataset_cache_ratio: 0.40     # Fraction of budget for dataset cache (soft limit only).
  vram_model_params_ratio: 0.30      # Fraction for model parameters (hard enforced).
  vram_kernel_workspace_ratio: 0.20  # Fraction for kernel temporary buffers (hard enforced).
  vram_emergency_ratio: 0.10         # Fraction held as emergency reserve and cuMemPool floor.
  gpu_pressure_threshold: 0.75       # VRAM utilisation above which cache allocation is halved.

compiler:
  torch_compile: false      # true → wrap model with torch.compile() (TorchInductor kernel fusion).
                            # First run is slower (compilation overhead); subsequent runs are faster.

dataset:
  dataset_name: MNIST
  data_path:

output:
  output_dir: ./outputs
  plot_dir: ./outputs/plots
  data_dir: ./outputs/data

# Per-framework neuron / optimiser / loss params.
# threshold=0.5: SNNTorch amplifies input 20x (V_eq=20I), Norse/SpikingJelly do not (V_eq=I).
# threshold=1.0 kills Norse (dead neurons, confirmed EXP-004). 0.5 is a safe neutral starting point.
frameworks:
  snntorch:
    beta:       0.95
    threshold:  0.5
    optimizer:  adam
    loss_fn:    mse_count

  norse:
    tau_mem_inv: 100.0
    threshold:   0.5
    optimizer:   adam
    loss_fn:     cross_entropy

  spikingjelly:
    tau:         2.0
    threshold:   0.5
    optimizer:   adam
    loss_fn:     cross_entropy
