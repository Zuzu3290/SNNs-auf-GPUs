framing:
  mode: n_time_bins       # "n_time_bins" (fixed T per sample, no padding — recommended for Conv-SNN)
                          # "time_window" (variable T, different samples span different durations — for analysis)
  n_time_bins: 16
  time_window_ms: 15.0

temporal_slicing:
  enabled: false

  events_per_slice: null
  calibrate_events_per_slice: false

cache:
  path: "./cache"
  memory_safety_margin_gb: 2.0
  memory_cache_threshold_gb: 6.0
  max_cached_recordings: 20000

# batch_size and num_workers live in SNN_module.yaml (training section)

