framing:
  mode: n_time_bins       # "n_time_bins" (fixed T per sample, no padding — recommended for Conv-SNN)
                          # "time_window" (variable T, different samples span different durations — for analysis)
  n_time_bins: 16
  time_window_ms: 15.0

temporal_slicing:
  enabled: false
  slice_duration_ms: 15.0
  overlap_ms: 0.0        # keep at 0 to avoid duplicate training samples
  min_events_per_slice: 10
  discard_incomplete: false
  auto_tune: false
  events_per_slice: null # set an int to switch to event-driven mode (ignores slice_duration_ms)

cache:
  path: "./cache"
  memory_safety_margin_gb: 2.0
  memory_cache_threshold_gb: 6.0
  max_cached_recordings: 500
  force_mode: null       # null | memory | disk | hybrid | no_cache

# batch_size and num_workers live in SNN_module.yaml (training section)
